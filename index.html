<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Interface</title>
    <style>
        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        /* Top Header */
        .header {
            display: flex;
            align-items: center;
            padding: 15px;
            background-color: #16161f;
            border-bottom: 1px solid #23232f;
        }
        .back-btn {
            font-size: 20px;
            margin-right: 15px;
            cursor: pointer;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            margin-right: 12px;
        }
        .user-info .name {
            font-weight: bold;
            font-size: 16px;
        }
        .user-info .status {
            font-size: 12px;
            color: #8b5cf6;
        }
        /* Chat Area */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.4;
        }
        .incoming {
            background-color: #1c1c27;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        /* 3 Web Design Buttons */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .action-btn {
            background-color: #252538;
            color: #ffffff;
            border: 1px solid #3f3f56;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: 0.2s;
        }
        .action-btn:hover {
            background-color: #313149;
            border-color: #8b5cf6;
        }
        /* Input Footer */
        .footer {
            padding: 15px;
            background-color: #16161f;
            border-top: 1px solid #23232f;
        }
        .input-box {
            width: 100%;
            background-color: #0d0d11;
            border: 1px solid #3f3f56;
            color: white;
            padding: 12px;
            border-radius: 25px;
            box-sizing: border-box;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- Header (Chatbot नाम के साथ) -->
    <div class="header">
        <div class="back-btn">←</div>
        <div class="avatar"></div>
        <div class="user-info">
            <div class="name">Chatbot</div>
            <div class="status">online</div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div class="chat-container">
        <div class="message incoming">
            नमस्ते! मैं आपका AI असिस्टेंट हूँ। नीचे दिए गए वेब डिज़ाइन विकल्पों में से किसी एक को चुनें:
            
            <!-- Web Design के 3 चालू बटन -->
            <div class="button-group">
                <button class="action-btn" onclick="selectOption('Create New Web Layout')">🌐 Web Design: Create Layout</button>
                <button class="action-btn" onclick="selectOption('Change Theme & Colors')">🎨 Web Design: Theme & Colors</button>
                <button class="action-btn" onclick="selectOption('Optimize Performance')">⚡ Web Design: Optimize</button>
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="footer">
        <input type="text" id="chatInput" class="input-box" placeholder="Message...">
    </div>

    <script>
        // बटन क्लिक होने पर इनपुट बॉक्स में टेक्स्ट भेजने के लिए फंक्शन
        function selectOption(optionText) {
            document.getElementById('chatInput').value = "Web Design: " + optionText;
        }
    </script>

</body>
</html>
